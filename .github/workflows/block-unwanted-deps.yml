---
name: Block Unwanted Dependencies

on:
  pull_request:
    paths:
      - 'package*.json'
      - 'yarn.lock'
      - '**/package*.json'
      - '**/yarn.lock'

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    name: Check for unwanted dependencies

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for unwanted dependencies
        run: |
          echo "🔍 Checking for unwanted dependencies..."

          # Define the unwanted dependencies with exact versions
          UNWANTED_DEPS=(
            "chalk@5.6.1"
            "debug@4.4.2"
            "ansi-styles@6.2.2"
            "supports-color@10.2.1"
            "strip-ansi@7.1.1"
            "ansi-regex@6.2.1"
            "wrap-ansi@9.0.1"
            "color-convert@3.1.1"
            "color-name@2.0.1"
            "is-arrayish@0.3.3"
            "slice-ansi@7.1.1"
            "color@5.0.1"
            "color-string@2.1.1"
            "simple-swizzle@0.2.3"
            "supports-hyperlinks@4.1.1"
            "has-ansi@6.0.1"
            "chalk-template@1.1.1"
            "backslash@0.2.1"
          )

          # Find all package*.json and yarn.lock files
          FILES=$(find . -name "package*.json" -o -name "yarn.lock")

          FOUND_DEPS=()

          # Check each file for unwanted dependencies
          for file in $FILES; do
            if [ -f "$file" ]; then
              echo "📁 Checking file: $file"

              for dep in "${UNWANTED_DEPS[@]}"; do
                # Use grep to search for the exact dependency with version
                MATCHES=$(grep -n "$dep" "$file" || true)

                if [ ! -z "$MATCHES" ]; then
                  echo "❌ Found unwanted dependency: $dep in $file"
                  echo "   Line(s): $MATCHES"
                  FOUND_DEPS+=("$dep in $file: $MATCHES")
                fi
              done
            fi
          done

          # If any unwanted dependencies were found, fail the workflow
          if [ ${#FOUND_DEPS[@]} -gt 0 ]; then
            echo ""
            echo "🚨 WORKFLOW FAILED: Unwanted dependencies detected!"
            echo "The following unwanted dependencies were found:"
            echo ""

            for found_dep in "${FOUND_DEPS[@]}"; do
              echo "  • $found_dep"
            done

            echo ""
            echo "Please remove these dependencies or update them to" \
                 "different versions."
            echo "These specific versions are blocked for security or" \
                 "compatibility reasons."

            exit 1
          else
            echo "✅ No unwanted dependencies found. All checks passed!"
          fi
