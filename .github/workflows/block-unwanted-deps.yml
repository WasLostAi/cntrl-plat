name: Block Unwanted Dependencies

on:
  pull_request:
    paths:
      - 'package*.json'
      - 'yarn.lock'
      - '**/package*.json'
      - '**/yarn.lock'

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    name: Check for unwanted npm dependencies
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check for unwanted dependencies
        run: |
          echo "🔍 Checking for unwanted npm dependencies..."
          
          # Define unwanted dependencies with exact versions
          UNWANTED_DEPS=(
            "chalk@5.6.1"
            "debug@4.4.2"
            "ansi-styles@6.2.2"
            "supports-color@10.2.1"
            "strip-ansi@7.1.1"
            "ansi-regex@6.2.1"
            "wrap-ansi@9.0.1"
            "color-convert@3.1.1"
            "color-name@2.0.1"
            "is-arrayish@0.3.3"
            "slice-ansi@7.1.1"
            "color@5.0.1"
            "color-string@2.1.1"
            "simple-swizzle@0.2.3"
            "supports-hyperlinks@4.1.1"
            "has-ansi@6.0.1"
            "chalk-template@1.1.1"
            "backslash@0.2.1"
          )
          
          # Find all package*.json and yarn.lock files
          FILES=$(find . -name "package*.json" -o -name "yarn.lock" | grep -v node_modules || true)
          
          if [ -z "$FILES" ]; then
            echo "✅ No package*.json or yarn.lock files found to check."
            exit 0
          fi
          
          echo "📁 Files to check:"
          echo "$FILES"
          echo ""
          
          FOUND_UNWANTED=false
          
          # Check each unwanted dependency in all files
          for dep in "${UNWANTED_DEPS[@]}"; do
            echo "🔎 Searching for: $dep"
            
            # Use grep to search for the exact dependency version
            MATCHES=$(echo "$FILES" | xargs grep -l "$dep" 2>/dev/null || true)
            
            if [ ! -z "$MATCHES" ]; then
              echo "❌ FOUND UNWANTED DEPENDENCY: $dep"
              echo "   Found in files:"
              for file in $MATCHES; do
                echo "   - $file"
                echo "     Matching lines:"
                grep -n "$dep" "$file" | sed 's/^/       /'
              done
              echo ""
              FOUND_UNWANTED=true
            fi
          done
          
          if [ "$FOUND_UNWANTED" = true ]; then
            echo ""
            echo "💥 WORKFLOW FAILED: Unwanted dependencies detected!"
            echo "The above dependencies with exact versions are not allowed in this repository."
            echo "Please remove or update these dependencies before merging."
            exit 1
          else
            echo "✅ No unwanted dependencies found. All checks passed!"
          fi